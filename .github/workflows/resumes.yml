name: Generate three-language CV PDFs

on:
  push:
    branches: [feat/editorial-hero]
    paths:
      - 'scripts/generate_cv_pdfs.py'
      - '.github/workflows/resumes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current portfolio branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF generator
        run: python -m pip install --quiet 'reportlab>=4,<5'
      - name: Generate UA, EN and IT PDFs
        run: python scripts/generate_cv_pdfs.py
      - name: Commit PDFs to public portfolio assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cv/Marina_Ravliuk_CV_UA.pdf public/cv/Marina_Ravliuk_CV_EN.pdf public/cv/Marina_Ravliuk_CV_IT.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Generate trilingual CV PDFs for public portfolio"
            git push origin HEAD:feat/editorial-hero
          fi
